AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda + API Gateway using SAM

Parameters:
  ImageUploadBucket:
    Type: String
    Description: S3 bucket for uploaded location images
    Default: trek-a-trip-images-bucket
  CognitoUserPoolId:
    Type: String
    Description: Cognito user pool that authenticates TripTrek API requests
    Default: us-east-1_Ks6i9yln5
  CognitoUserPoolClientId:
    Type: String
    Description: Cognito app client used by the TripTrek frontend
    Default: 3n8imnlps0an3lj9rp2umi7bu6
  OpenAIModel:
    Type: String
    Description: OpenAI model used by the Trekka travel assistant
    Default: ft:gpt-3.5-turbo-0125:personal:trekka:C1G5p4GH

Resources:

  TripTrekTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TripTrek
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  TripTrekAPI:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: TripTrekAPI
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
                - !Ref CognitoUserPoolClientId
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoJwtAuthorizer

  LocationImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ImageUploadBucket
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedHeaders:
              - "*"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  createTrip:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: createTrip
      Handler: index.handler
      Runtime: nodejs22.x 
      CodeUri: create/
      Environment:
        Variables:
          TABLE_NAME: !Ref TripTrekTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripTrekTable
      Events:
        ApiForMyApp:
          Type: HttpApi
          Properties:
            Path: /createTrip
            Method: POST
            ApiId: !Ref TripTrekAPI

  getTripList:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: getTripList
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: read/
      Environment:
        Variables:
          TABLE_NAME: !Ref TripTrekTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripTrekTable
      Events:
        ApiForMyApp:
          Type: HttpApi
          Properties:
            Path: /getTripList
            Method: GET
            ApiId: !Ref TripTrekAPI
  
  updateTrip:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: updateTrip
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: update/
      Environment:
        Variables:
          TABLE_NAME: !Ref TripTrekTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripTrekTable
      Events:
        ApiForMyApp:
          Type: HttpApi
          Properties:
            Path: /updateTrip
            Method: PATCH
            ApiId: !Ref TripTrekAPI

  deleteTrip:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deleteTrip
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: delete/
      Environment:
        Variables:
          TABLE_NAME: !Ref TripTrekTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripTrekTable
      Events:
        ApiForMyApp:
          Type: HttpApi
          Properties:
            Path: /deleteTrip
            Method: DELETE
            ApiId: !Ref TripTrekAPI

  tripShares:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tripShares
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: share/
      Environment:
        Variables:
          TABLE_NAME: !Ref TripTrekTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TripTrekTable
      Events:
        GetShares:
          Type: HttpApi
          Properties:
            Path: /tripShares
            Method: GET
            ApiId: !Ref TripTrekAPI
        CreateShare:
          Type: HttpApi
          Properties:
            Path: /tripShares
            Method: POST
            ApiId: !Ref TripTrekAPI
        DeleteShare:
          Type: HttpApi
          Properties:
            Path: /tripShares
            Method: DELETE
            ApiId: !Ref TripTrekAPI

  trekkaChat:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: trekkaChat
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: chat/
      Timeout: 35
      MemorySize: 256
      Environment:
        Variables:
          OPENAI_SECRET_ID: TripTrek/openai
          OPENAI_MODEL: !Ref OpenAIModel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:TripTrek/openai-*
      Events:
        Chat:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref TripTrekAPI
  
  imageUploader:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: imageUploader
      Handler: index.handler
      Runtime: nodejs22.x
      CodeUri: images/
      Environment:
        Variables:
          LOCATION_IMAGES_BUCKET: !Ref ImageUploadBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ImageUploadBucket
      Events:
        ApiForMyApp:
          Type: HttpApi
          Properties:
            Path: /generateUploadUrl
            Method: POST
            ApiId: !Ref TripTrekAPI

Outputs:
  ApiUrl:
    Description: "HTTP API endpoint base URL"
    Value: !Sub "https://${TripTrekAPI}.execute-api.${AWS::Region}.amazonaws.com"
  LocationImagesBucketName:
    Description: "S3 Image Bucket Name"
    Value: !Ref LocationImagesBucket
